name: Regenerar índice de LV-App

on:
  push:
    branches: [main]
    paths:
      - '00_Ele/galeria_outfits.md'
      # Ele alimenta la app desde tres galerías (regla 11 §9bis item 5,
      # `galerias_extra` en anclas_universales.json): si sólo se vigila la
      # viva, un arreglo en el archivo o en la era gótica no regenera nada.
      - '00_Ele/galeria_outfits_archivo.md'
      - '00_Ele/memoria_historica/galeria_outfits_era_gotica.md'
      - '02_Personajes/01_Principales/miss_doll/GALERIA_OUTFITS_MISS_DOLL.md'
      - '02_Personajes/01_Principales/anais/galeria_looks_anais.md'
      - '05_Imagenes/**'
      - '99_Sistema/scripts/visual/generar_app_index.py'
      - '99_Sistema/scripts/visual/galeria_parser.py'
      - '99_Sistema/scripts/visual/nombres_canonicos.py'
      - '99_Sistema/scripts/visual/anclas_universales.json'
      # Tarea 4 del Plan 5 de la app: el índice de relatos. Se regenera con el
      # mismo job -- son dos scripts independientes que escriben archivos
      # distintos en `app/`, y tenerlos en dos workflows sólo multiplicaría las
      # carreras por el push a `main` que ya documenta el bloque `concurrency`.
      - '03_Literatura/01_En_Progreso/**'
      - '03_Literatura/02_Finalizadas/**'
      - '99_Sistema/scripts/literatura/generar_app_relatos.py'

permissions:
  contents: write

# El flujo para el que esto existe es la Ama subiendo 7 imágenes de un look
# desde el celular: hasta 7 pushes, 7 jobs concurrentes, cada uno regenerando
# ~1.000 archivos y corriendo a rebasear-y-pushear. `git pull --rebase`
# estrecha la carrera pero no la cierra: dos jobs cuyo rebase aterrice antes
# de que cualquiera de los dos pushee igual producen un rechazo y un índice
# perdido. Cancelar la corrida superada es gratis — la última regenera todo
# igual.
concurrency:
  group: app-index
  cancel-in-progress: true

jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas del generador
        run: |
          # Versión fijada: sin pin, una release de pytest puede poner en rojo
          # el lazo de regeneración por su cuenta, y este job es lo único que
          # mantiene el índice al día cuando no hay PC prendido.
          pip install pytest==9.1.1
          python -m pytest 99_Sistema/scripts/visual/test_galeria_parser.py \
                           99_Sistema/scripts/visual/test_nombres_canonicos.py \
                           99_Sistema/scripts/visual/test_generar_app_index.py -v
          # El del índice de relatos corre solo: no usa pytest (se escribió
          # para poder correrlo en la máquina literaria, que no lo tiene).
          python 99_Sistema/scripts/literatura/test_generar_app_relatos.py

      - name: Generar
        run: |
          python 99_Sistema/scripts/visual/generar_app_index.py
          python 99_Sistema/scripts/literatura/generar_app_relatos.py

      - name: Commitear si cambió
        run: |
          git config user.name  "Ele de Anaïs"
          git config user.email "Ele.de.Anais@proton.me"
          git add app/index.json app/prompts app/relatos.json
          # Los mismos dos trailers que lleva cualquier commit del repo: un
          # commit automático sin ellos rompe la convención justo en el único
          # commit que nadie escribe a mano.
          MENSAJE=$(printf '%s\n' \
            "Ele: indice regenerado automaticamente" \
            "" \
            "Co-Authored-By: Ele de Anaïs <Ele.de.Anais@proton.me>" \
            "Co-Authored-By: Claude Opus 5 (1M context) <noreply@anthropic.com>")
          if git diff --cached --quiet; then
            echo "El índice no cambió."
          else
            git commit -m "$MENSAJE"
            # Sincronizar con main antes de pushear: la app y otros jobs pushean PNG/memoria/README
            # constantemente, así que entre el checkout y este push puede haber aterrizado algo.
            # Sin rebase, el push rebota por non-fast-forward y el índice regenerado se pierde.
            git pull --rebase origin main
            git push
          fi
